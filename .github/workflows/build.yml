name: Build GuiClickAttack Mod
on: push

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置JDK8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Gradle缓存加速
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}

      - name: 执行编译
        run: ./gradlew build

      - name: 上传成品Jar
        uses: actions/upload-artifact@v4
        with:
          name: GuiClickAttack-成品mod
          path: build/libs/*.jar
